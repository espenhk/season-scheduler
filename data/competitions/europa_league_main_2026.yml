# 2026-27 UEFA Europa League — the main tournament, issue #79.
#
# format: european, movable: false, is_main_tournament: true — see
# champions_league_main_2026.yml's header for the general shape of this
# file, its sourcing/verification notes, and the "assume it reaches the
# final" simplification `league_phase_matchdays`/`knockout_rounds` make.
#
# Reached from europa_league_2026 (a play-off win), and from
# champions_league_2026 (a Q3 or play-off loss) via `on_win_main` /
# `on_loss_main` on those rounds (#8).
#
# matchday_weekdays: Thursday — see champions_league_main_2026.yml's header
# (#112). The final is a confirmed Wednesday `forced_date`, which a
# matchday weekday never overrides.
#
# verified: false — see champions_league_main_2026.yml's header for
# sourcing and channel; the Europa League final's venue and date come from
# Wikipedia's 2027 UEFA Europa League final page.
id: europa_league_main_2026
name: UEFA Europa League
short_name: "EL"
season: 2026
gender: men
format: european
movable: false
is_main_tournament: true

# UEFA family colour, the main tournament's shade (#36); see the colour test in tests/report/test_render.py.
color: "#605010"

team_count: 0
teams: []

min_rest_days: 2
matchday_weekdays: [thursday]

league_phase_matchdays:
  - id: md1
    name: Matchday 1
    window_start: 2026-09-16
    window_end: 2026-09-17
    granularity: week
  - id: md2
    name: Matchday 2
    forced_date: 2026-10-15
  - id: md3
    name: Matchday 3
    forced_date: 2026-10-22
  - id: md4
    name: Matchday 4
    forced_date: 2026-11-05
  - id: md5
    name: Matchday 5
    forced_date: 2026-11-26
  - id: md6
    name: Matchday 6
    forced_date: 2026-12-10
  - id: md7
    name: Matchday 7
    forced_date: 2027-01-21
  - id: md8
    name: Matchday 8
    forced_date: 2027-01-28

knockout_rounds:
  - id: playoff
    name: Knockout phase play-offs
    note: "Only teams finishing 9th-24th in the league phase play this round — see header."
    first_leg:
      forced_date: 2027-02-18
    second_leg:
      forced_date: 2027-02-25

  - id: round_of_16
    name: Round of 16
    first_leg:
      forced_date: 2027-03-11
    second_leg:
      forced_date: 2027-03-18

  - id: quarterfinal
    name: Quarter-final
    first_leg:
      forced_date: 2027-04-08
    second_leg:
      forced_date: 2027-04-15

  - id: semifinal
    name: Semi-final
    first_leg:
      forced_date: 2027-04-29
    second_leg:
      forced_date: 2027-05-06

  - id: final
    name: Final
    note: "Single match, neutral venue — fixed years in advance, independent of either finalist."
    first_leg:
      forced_date: 2027-05-26
    venue_name: "Deutsche Bank Park (Waldstadion), Frankfurt"
