# The 2026 Norwegian Football Cup (NM kvinner). Unlike the men's, the women's
# 2026 edition runs entirely inside the calendar year (April to September), so
# its rounds overlap the Toppserien season. Toppserien clubs enter at Round 2;
# Round 1 (22 Apr) is lower-division only and is not modelled.
#
# verified: false — dates come from a single club news page (stabak.no, "Slik
# blir cupåret 2026") and have not been checked against the NFF terminliste.
# sources:
#   - "stabak.no: Slik blir cupåret 2026 — R2 Tue 12 May, R3 Wed 20 May, R4 Wed 17 Jun, semi-finals Sat 27 Jun, final Sun 6 Sep (Ullevaal)"
id: cup_women_2026
name: NM Cupen 2026 (kvinner)
short_name: "NM26(k)"
season: 2026
gender: women
format: cup

