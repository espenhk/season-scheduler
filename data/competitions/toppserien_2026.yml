id: toppserien_2026
name: Toppserien
short_name: "TS"
season: 2026
gender: women
format: league

# Season report colour (issue #77) — see eliteserien_2026.yml's comment.
color: "#7e22ce"

# Scheduler-controlled, same as eliteserien_2026.yml — see its comment and
# issue #31.
movable: true

# Double round-robin, same as Eliteserien: every pairing meets twice, once
# home and once away.
rounds_per_pairing: 2

# Format confirmed 2026-11-10 against the league's and clubs' own pages: 12
# teams, a plain double round-robin of 22 rounds with no split, and a
# qualifier for 10th place against the second-division play-off winner. The
# 15 and 22 November dates are from Wikipedia's qualifier page; the Stabaek
# page only confirms that the qualifier ends 22 November.
format_source: "https://toppserien.no/nyheter/slik-spilles-toppserien-2026 ; https://www.stabak.no/nyheter/2510-termin-2026 ; https://no.wikipedia.org/wiki/Kvalifisering_til_Toppserien_i_fotball_for_kvinner_2027"
phases:
  - {kind: regular, rounds: 22, label: "Serierunder"}
playoff_rounds:
  - id: coop_ligaen_playoff
    kind: promotion_playoff
    label: "COOP-ligaen play-off (3rd v 4th, two legs)"
    # Unconfirmed: no NFF or league page found for these two dates.
    dates: [2026-10-31, 2026-11-07]
    reserves_league: false
    source: "https://no.wikipedia.org/wiki/Kvalifisering_til_Toppserien_i_fotball_for_kvinner_2027"
  - id: toppserien_qualifier
    kind: relegation_playoff
    label: "Toppserien qualifier (10th v play-off winner, two legs)"
    dates: [2026-11-15, 2026-11-22]
    source: "https://www.stabak.no/nyheter/2510-termin-2026 ; https://no.wikipedia.org/wiki/Kvalifisering_til_Toppserien_i_fotball_for_kvinner_2027"

# 12 teams -> 11 rounds per leg -> 22 rounds, 132 matches.
team_count: 12
teams:
  - aalesund_w
  - bodo_glimt_w
  - brann_w
  - haugesund_w
  - honefoss_w
  - lsk_kvinner_w
  - lyn_w
  - molde_w
  - roa_w
  - rosenborg_w
  - stabak_w
  - valerenga_w

# The real 2026 Toppserien window: round 1 is Saturday 21 March, but its
# Bodø/Glimt v Hønefoss match was brought forward to Friday 20 March
# (toppserien.no "Slik spilles Toppserien 2026"); final round 7 November,
# excluding playoffs. Ends almost a month before Eliteserien/the season's
# outer envelope; 22 rounds fit that window comfortably. See
# `terminliste/model/loader.py::_validate_calendar_capacity` for the check
# that enforces this.
start: 2026-03-20
end: 2026-11-07

# Saturday, deliberately the day before Eliteserien's Sunday: it makes the
# back-to-back home weekend the natural outcome for the six dual clubs rather
# than something the solver has to fight the weekday preference to reach.
preferred_weekday: saturday

min_rest_days: 2
match_window_days: 3

weights:
  preferred_weekday: 4.0
  consecutive_home_days: 25.0
  consecutive_away_days: 15.0
  home_away_breaks: 8.0
  home_away_balance: 6.0
  rest_comfort: 3.0
  soft_venue_preference: 5.0
  grass_season_edge: 1.5

comfortable_rest_days: 5
