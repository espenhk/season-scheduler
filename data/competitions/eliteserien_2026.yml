id: eliteserien_2026
name: Eliteserien
short_name: "ES"
season: 2026
gender: men
format: league

# Season report colour (issue #77) — the men's top flight's own dot/tag on
# the calendar and combined views, kept distinct from every other
# competition (terminliste/model/loader.py::_validate_competition_colors
# enforces that).
color: "#ca6f1e"

# This project generates and dates Eliteserien's fixtures — issue #31's
# "scheduler-controlled" case, as opposed to a cup or European competition,
# whose real-world dates the solver only schedules around (movable: false —
# see cup_men_2027.yml and champions_league_2026.yml).
movable: true

# Double league: everyone meets twice, once home and once away. The second leg
# is the mirror of the first, so all first meetings are complete before any
# second meeting starts. Set to 1 for a single league; the round generator
# handles any value.
rounds_per_pairing: 2

# Format confirmed 2026-11-10: 16 teams, a plain double round-robin of 30
# rounds with no split, and a play-off for 14th place. The qualifier chain
# (OBOS-ligaen 5th v 6th on 22 Nov, then 4th and 3rd on 29 Nov and 6 Dec, and
# the winner against Eliteserien's 14th over two legs) is from NFF's
# "Slik spilles kvalifiseringskampene" and Wikipedia's qualifier page. They
# disagree on the last two legs (Wikipedia: 17 and 21 Dec; NFF lists 21 Dec
# only), so 17 Dec is unconfirmed. Eliteserien.no also says the last league
# round is Sunday 13 Dec, not the 6 Dec below; `end` is left alone until that
# is settled against the NFF fixture list (#15).
format_source: "http://www.fotball.no/tema/nff-nyheter/2026/slik-spilles-kvalifiseringskampene/ ; https://www.eliteserien.no/nyheter/playoff-slik-blir-veien-mot-eliteserien-2027 ; https://no.wikipedia.org/wiki/Kvalifisering_til_Eliteserien_i_fotball_for_menn_2027"
phases:
  - {kind: regular, rounds: 30, label: "Serierunder"}
playoff_rounds:
  - id: obos_qualifier
    kind: promotion_playoff
    label: "OBOS-ligaen qualifier (5th v 6th, then 4th, then 3rd)"
    dates: [2026-11-22, 2026-11-29, 2026-12-06]
    reserves_league: false
    source: "http://www.fotball.no/tema/nff-nyheter/2026/slik-spilles-kvalifiseringskampene/"
  - id: eliteserien_relegation_playoff
    kind: relegation_playoff
    label: "Eliteserien 14th v qualifier winner (two legs)"
    dates: [2026-12-17, 2026-12-21]
    source: "https://no.wikipedia.org/wiki/Kvalifisering_til_Eliteserien_i_fotball_for_menn_2027"

# 16 teams -> 15 rounds per leg -> 30 rounds, 240 matches.
team_count: 16
teams:
  - aalesund_m
  - bodo_glimt_m
  - brann_m
  - fredrikstad_m
  - hamkam_m
  - kfum_oslo_m
  - kristiansund_m
  - lillestrom_m
  - molde_m
  - rosenborg_m
  - sandefjord_m
  - sarpsborg08_m
  - start_m
  - tromso_m
  - valerenga_m
  - viking_m

# The real 2026 Eliteserien window (verified 2026-08-16 via web search —
# multiple sources agree on 14 March kickoff and 6 December final round,
# excluding relegation/European playoffs). Equal to the season's own
# start/end, so this is redundant in effect — set explicitly anyway so both
# leagues' windows are spelled out here rather than one being implicit.
start: 2026-03-14
end: 2026-12-06

# Eliteserien wants the bulk of its matches on Sunday.
preferred_weekday: sunday

# Hard rule parameters.
min_rest_days: 2

# How far an individual match may float from its round's anchor date. A ±3 day
# window turns a round into a Friday-to-Monday weekend, which is the freedom
# the solver needs to avoid venue clashes and chase back-to-back home days.
match_window_days: 3

# Soft-constraint weights. Positive-weighted constraints award points, negative
# ones deduct them; the report ranks by the resulting signed contribution.
# Tuning the schedule is an edit here, not a code change.
weights:
  preferred_weekday: 4.0
  consecutive_home_days: 25.0
  consecutive_away_days: 15.0
  home_away_breaks: 8.0
  home_away_balance: 6.0
  rest_comfort: 3.0
  soft_venue_preference: 5.0

# Rest beyond the hard minimum that we would like every team to get.
comfortable_rest_days: 5
