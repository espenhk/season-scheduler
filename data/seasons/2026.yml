id: 2026
year: 2026

# The outer envelope for both competitions: earliest kickoff to latest final
# round, across Eliteserien and Toppserien. Verified 2026-08-16 via web search
# against multiple corroborating sources (Wikipedia season-page snippets,
# viasport.com) — see the `competitions/*.yml` files for each league's own,
# narrower window: Eliteserien runs the full envelope (14 Mar – 13 Dec), but
# Toppserien finishes almost a month earlier (20 Mar – 7 Nov). Previously this
# file carried a single hand-guessed `start: 2026-03-28` for both leagues,
# which was simply wrong for either one.
start: 2026-03-14
end: 2026-12-13

competitions:
  - eliteserien_2026
  - toppserien_2026

# Cups sharing teams with the leagues above, kept separate because their
# rounds are real-world fixed dates rather than something the solver
# schedules — see cup_men_2027.yml / cup_women_2027.yml. The 2027 cup starts
# in August 2026 and runs into spring 2027, so its later rounds fall after
# this season's own end date; that is expected, not a data error. The 2026
# editions are the spring 2026 rounds of the previous cup year, which overlap
# the league season.
cup_competitions:
  - cup_men_2026
  - cup_women_2026
  - cup_men_2027
  - cup_women_2027

# UEFA-fixed qualifying cascade (Champions/Europa/Conference League) —
# issue #29 — plus each competition's main tournament (issue #79). Not fed
# to the round-robin/solver pipeline, same reason as cup_competitions
# above; see `data/competitions/champions_league_2026.yml`,
# `data/competitions/champions_league_main_2026.yml`, and
# `terminliste/rounds/european_schedule.py`.
european_competitions:
  - champions_league_2026
  - europa_league_2026
  - conference_league_2026
  - champions_league_main_2026
  - europa_league_main_2026
  - conference_league_main_2026

# Dates on which nobody plays, in any competition.
global_blackouts:
  - {date: 2026-04-03, reason: "Langfredag (Good Friday)"}
  - {date: 2026-04-05, reason: "Første påskedag (Easter Sunday)"}
  - {date: 2026-05-17, reason: "Grunnlovsdagen — national day, no matches"}
  - {date: 2026-06-23, reason: "Sankthansaften"}
  - {date: 2026-12-24, reason: "Julaften"}
  # Cup rounds run into 2027, so the holidays are listed there too (#5).
  - {date: 2027-03-26, reason: "Langfredag (Good Friday)"}
  - {date: 2027-03-28, reason: "Første påskedag (Easter Sunday)"}
  - {date: 2027-05-17, reason: "Grunnlovsdagen — national day, no matches"}

# International windows and the World Cup break, scoped to the competitions
# they actually stop. Men's windows are per the FIFA calendar; the Eliteserien
# pauses for the World Cup. Women's windows are approximate (verified: false)
# until FIFA's exact dates are confirmed.
global_blackout_ranges:
  - {start: 2026-03-23, end: 2026-03-31, gender: men, reason: "FIFA window (men)"}
  - {start: 2026-05-26, end: 2026-07-03, competitions: [eliteserien_2026], reason: "World Cup break (Eliteserien)"}
  - {start: 2026-09-21, end: 2026-10-06, gender: men, reason: "FIFA window (men)"}
  - {start: 2026-11-09, end: 2026-11-17, gender: men, reason: "FIFA window (men)"}
  # Approximate (verified: false) — FIFA's 2027 men's window, placed as in 2026.
  - {start: 2027-03-22, end: 2027-03-30, gender: men, reason: "FIFA window (men)"}

# Dates that are legal but discouraged; scheduling here costs
# `soft_venue_preference` points rather than being rejected outright.
discouraged_dates:
  - {date: 2026-07-04, reason: "Peak summer holiday — low attendance"}
  - {date: 2026-07-11, reason: "Peak summer holiday — low attendance"}
  - {date: 2026-07-18, reason: "Peak summer holiday — low attendance"}

# Per-venue unavailability spanning more than one consecutive day — issue
# #33's venue-scoped counterpart to `global_blackout_ranges` below.
venue_blackout_ranges:
  - {venue: intility_arena, start: 2026-06-13, end: 2026-06-14, reason: "Concert and teardown"}

# Per-venue unavailability on a single day: concerts, athletics meets, ground works.
venue_blackouts:
  - {venue: lerkendal_stadion, date: 2026-07-25, reason: "Concert"}
  - {venue: brann_stadion, date: 2026-08-15, reason: "Concert"}
  - {venue: araasen_stadion, date: 2026-05-30, reason: "Ground works"}

# Dates that must carry a match, with a named team at home.
#
# May 16 is the eve of the national day: the big clubs want a home game with
# the city already full. `hard: true` means the solver must satisfy it; flip to
# false to demote it to a scored preference instead.
fixed_requirements:
  - id: may16_valerenga
    date: 2026-05-16
    home_team: valerenga_m
    competition: eliteserien_2026
    hard: true
    reason: "May 16 — Vålerenga at home in Oslo on the eve of the national day"

  - id: may16_brann
    date: 2026-05-16
    home_team: brann_m
    competition: eliteserien_2026
    hard: true
    reason: "May 16 — Brann at home in Bergen on the eve of the national day"

  - id: may16_rosenborg_m
    date: 2026-05-16
    home_team: rosenborg_m
    competition: eliteserien_2026
    hard: true
    reason: "May 16 — Rosenborg at home at Lerkendal on the eve of the national day"

  - id: may16_viking
    date: 2026-05-16
    home_team: viking_m
    competition: eliteserien_2026
    hard: true
    reason: "May 16 — Viking at home in Stavanger on the eve of the national day"

  # Rosenborg women were previously also pinned home at Lerkendal on May 16,
  # but the men's team now has the same requirement (`may16_rosenborg_m`
  # above, added for issue #38) and the two share the one stadium — both
  # cannot be true. The men's fixture wins: it is what the full Eliteserien
  # round on May 16 (`full_round_requirements` below) actually needs, and
  # Toppserien has no equivalent full-round rule forcing this particular date.

  - id: moldejazz_molde
    date: 2026-07-19
    home_team: molde_m
    competition: eliteserien_2026
    hard: true
    reason: >-
      Moldejazz runs 13-18 July 2026 (verified 2026-08-16 via web search); Molde
      at home the Sunday it closes keeps the festival crowd in town for the
      match

  - id: midnight_sun_tromso
    date: 2026-07-11
    home_team: tromso_m
    competition: eliteserien_2026
    hard: true
    kickoff_time: "22:00"
    reason: >-
      Midnattsolkampen (the Midnight Sun Match) — Tromsø's annual home fixture
      played under the midnight sun with a 22:00 kickoff. Recent editions were
      13 July 2024 and 15 July 2025 (verified 2026-08-16 via web search); no
      fixed weekday, so mid-July is used as the representative date

# A date every team in a competition must have a match on — not just the
# named teams above, the whole round. May 16 in Eliteserien: the eve of the
# national day, played out as a full round rather than a handful of marquee
# fixtures.
full_round_requirements:
  - id: may16_full_round
    date: 2026-05-16
    competition: eliteserien_2026
    hard: true
    reason: "May 16 is a full Eliteserien round — every club plays on the eve of the national day"

# A fixed pairing on a fixed date, home advantage alternating by year parity.
rivalry_fixtures:
  - id: may16_bodo_glimt_tromso
    date: 2026-05-16
    competition: eliteserien_2026
    team_even_year_home: bodo_glimt_m
    team_odd_year_home: tromso_m
    weight: 20.0
    reason: >-
      Bodø/Glimt host Tromsø IL on May 16 in even years (2026 included),
      alternating home advantage every year — the northern Norway derby,
      worth landing on the national-day round.

# Single-day round candidates beyond the Fri-Mon weekends. The planner takes
# one only when it beats the weekend it overlaps or the weekends run short (#6).
# With the World Cup break, three FIFA windows and the cup weekends removed,
# Eliteserien has only 28 usable weekends for 30 rounds, hence the midweek
# candidates. The midweek dates are placeholders (verified: false) chosen clear
# of the resolved cup and UEFA dates.
extra_round_slots:
  - {date: 2026-04-06, kind: holiday, reason: "Andre påskedag (Easter Monday)"}
  - {date: 2026-05-14, kind: holiday, reason: "Kristi himmelfartsdag (Ascension Day)"}
  - {date: 2026-05-25, kind: holiday, reason: "Andre pinsedag (Whit Monday)"}
  - {date: 2026-04-29, kind: midweek, competitions: [eliteserien_2026], reason: "Midweek round"}
  - {date: 2026-05-06, kind: midweek, competitions: [eliteserien_2026], reason: "Midweek round"}
  - {date: 2026-07-08, kind: midweek, competitions: [eliteserien_2026], reason: "Midweek round"}
  - {date: 2026-07-15, kind: midweek, competitions: [eliteserien_2026], reason: "Midweek round"}
  - {date: 2026-10-28, kind: midweek, competitions: [eliteserien_2026], reason: "Midweek round"}
  - {date: 2026-11-18, kind: midweek, competitions: [eliteserien_2026], reason: "Midweek round"}
