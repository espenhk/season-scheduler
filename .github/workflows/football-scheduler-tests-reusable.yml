name: football-scheduler test suite

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      suites:
        description: >
          Space-separated list of folders under tests/
          to run, e.g. "solvers integration". Use "." to run everything.
        required: true
        type: string
      with-cpsat:
        description: >
          Install OR-Tools so the CP-SAT tests run instead of skipping.
          Only the solvers and integration suites use it.
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suites }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-fs-${{ inputs.with-cpsat && 'cpsat-' || '' }}${{ runner.os }}-py3.11-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        env:
          GROUPS_TO_INSTALL: football-scheduler,football-scheduler-test${{ inputs.with-cpsat && ',football-scheduler-cpsat' || '' }}
        run: poetry install --only "$GROUPS_TO_INSTALL"

      # Only the report suite drives a browser (tests/report/test_report_page.py,
      # test_report_a11y.py, test_report_links.py and test_report_size.py), which skip themselves when none is installed.
      - name: Install Chromium for the report browser test
        if: inputs.suites == '.' || contains(format(' {0} ', inputs.suites), ' report ')
        run: poetry run playwright install --with-deps chromium

      - name: Run tests
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          paths=""
          for suite in $SUITES; do
            paths="$paths tests/$suite"
          done
          poetry run python -m pytest $paths -v
