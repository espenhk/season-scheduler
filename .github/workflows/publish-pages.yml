name: publish season report to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      time_budget_minutes:
        description: "Minutes the solver may spend generating the schedule before the page is published"
        type: number
        default: 1

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --only football-scheduler

      - name: Build season schedule report
        env:
          # Pushes have no inputs, so they fall back to the 60 s default.
          TIME_BUDGET_MINUTES: ${{ inputs.time_budget_minutes || 1 }}
        run: |
          budget_s=$(python -c "import os, sys; m = float(os.environ['TIME_BUDGET_MINUTES']); sys.exit('time_budget_minutes must be > 0') if m <= 0 else print(m * 60)")
          echo "Generating with a ${budget_s}s time budget"
          poetry run python scripts/publish_web.py --time-budget "$budget_s"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
