# Path -> suites mapping is documented in tests/README.md.
name: football-scheduler tests (all)

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "terminliste/model/**"
      - "terminliste/rounds/cup_schedule.py"
      - "terminliste/rounds/european_schedule.py"
      - "data/**"
      - "tests/conftest.py"
      - "tests/factories.py"
      - "conftest.py"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/football-scheduler-tests-reusable.yml"
      - ".github/workflows/fs-tests-all.yml"

jobs:
  test:
    # Skip draft PRs, but always run when a draft is converted to ready for review.
    if: github.event.action == 'ready_for_review' || !github.event.pull_request.draft
    uses: ./.github/workflows/football-scheduler-tests-reusable.yml
    with:
      suites: "."
